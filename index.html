<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AUX Studio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Hide real cursor once activated */
    body.cursor-hidden,
    body.cursor-hidden * {
      cursor: none !important;
    }

    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 18px 24px;
    }

    nav p {
      font-family: Arial, Helvetica, sans-serif;
      font-weight: bold;
      font-size: 11px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    nav p:first-child { justify-self: start; }
    nav p:nth-child(2) { justify-self: center; }
    nav p:last-child  { justify-self: end; }

    /* Mobile: hide the side items from the top nav */
    @media (max-width: 600px) {
  nav {
    display: flex;
    justify-content: center;
  }

  nav p:first-child,
  nav p:last-child {
    display: none;
  }

  nav p {
    font-size: 10px;
  }
}

    /* Bottom bar — hidden on desktop */
    #bottom-nav {
      display: none;
    }

    @media (max-width: 600px) {
      #bottom-nav {
        display: flex;
        position: fixed;
        bottom: 0; left: 0; right: 0;
        z-index: 20;
        justify-content: space-between;
        align-items: center;
        padding: 18px 24px;
      }

      #bottom-nav p {
        font-family: Arial, Helvetica, sans-serif;
        font-weight: bold;
        font-size: 10px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
    }

    a { text-decoration: none; color: black; }
    a:hover { color: rgb(255,255,255); }

    #dither-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      width: 100%; height: 100%;
      opacity: 0;
      transition: opacity 1.2s ease;
      image-rendering: pixelated;
    }

    #dither-canvas.visible { opacity: 1; }

    #logo-wrap {
      position: relative;
      z-index: 10;
      width: min(580px, 52vw);
      cursor: pointer;
      transition: transform 0.4s ease, opacity 0.3s ease;
    }

    #logo-wrap svg path {
      fill: #ffffff;
      stroke: #000000;
      stroke-width: 4px;
      paint-order: stroke fill;
      transition: fill 0.4s ease, stroke 0.4s ease, stroke-width 0.4s ease;
    }

    #logo-wrap:hover { transform: scale(1.03); }
    #logo-wrap:hover svg path { fill: #000000; stroke: none; stroke-width: 0; }

    #logo-wrap.activated {
      pointer-events: none;
      transform: scale(1.03);
      opacity: 1;
    }
    #logo-wrap.activated svg path { fill: #000000; stroke: none; stroke-width: 0; }

    #logo-wrap.activated svg {
      filter: drop-shadow(0 0 0px rgba(255,255,255,0));
      transition: filter 0.4s ease;
    }

    #logo-wrap.activated:hover svg {
      filter: drop-shadow(0 0 8px rgba(255,255,255,0.9)) drop-shadow(0 0 20px rgba(255,255,255,0.4));
    }

    #logo-wrap.activated.hoverable {
      pointer-events: auto;
      cursor: none;
    }

    #spinner {
      position: fixed;
      top: calc(50% + min(290px, 26vw) + 20px);
      left: 50%;
      transform: translateX(-50%);
      width: 24px;
      height: 24px;
      z-index: 100;
      display: none;
    }

    #spinner.visible { display: block; }

    #spinner svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    #spinner-track {
      fill: none;
      stroke: #000;
      stroke-width: 1.5;
      opacity: 0.15;
    }

    #spinner-fill {
      fill: none;
      stroke: #000;
      stroke-width: 1.5;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.25s linear;
    }

    #cursor-tooltip {
      position: fixed;
      z-index: 1000;
      pointer-events: none;
      display: none;
      text-align: center;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 0.04em;
      line-height: 1.65;
      text-transform: uppercase;
      color: #000000;
      transform: translate(-50%, -50%);
      white-space: nowrap;
    }

    #cursor-tooltip.always-visible {
      display: block;
    }

    #cursor-tooltip .lowercase-line {
      text-transform: none;
      font-weight: normal;
      font-style: italic;
    }
  </style>
</head>
<body>

  <nav>
    <p><a href="mailto:help@auxstudio.live">help@auxstudio.live</a></p>
    <p>AUX STUDIO</p>
    <p>NY &amp; CA</p>
  </nav>

  <!-- Mobile-only bottom bar -->
  <div id="bottom-nav">
    <p><a href="mailto:help@auxstudio.live">help@auxstudio.live</a></p>
    <p>NY &amp; CA</p>
  </div>

  <canvas id="dither-canvas"></canvas>

  <div id="spinner">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <circle id="spinner-track" cx="12" cy="12" r="10"/>
      <circle id="spinner-fill" cx="12" cy="12" r="10"/>
    </svg>
  </div>

  <div id="logo-wrap" role="button" aria-label="Enter site">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 576">
      <path d="M550.39,303.13h-51.68c-2.07,72.77-45.69,115.34-45.69,115.34l-142.43-142.3.88-248.44C135.57,11.36-24.04,184.41,40.06,373.4c61.21,180.46,294.19,235.87,430.58,101.2,3.43-3.39,6.75-6.85,9.95-10.37l8.69-9.5c63.29-69.57,61.1-151.6,61.1-151.6ZM235.81,82.56c4.55-1.1,25.92-7.23,25.92-1.97v174.26H77.77c13.54-80.17,72.35-151.53,158.04-172.29ZM104.06,396.04c-17.63-29.45-26.9-61.22-28.87-92.91h161.37l-115.44,115.34-17.06-22.42ZM403.35,464.1c-73.1,37.96-160.25,38.02-233.17-.28-6.53-3.43-11.9-6.62-15.52-9.39l108.89-107.7,23.15-22.22,23.89,22.22,108.89,107.7c-3.72,2.85-9.31,6.14-16.12,9.67Z"/>
    </svg>
  </div>

  <div id="cursor-tooltip">
    APPEALING USER EXPERIENCE<br>
    ALWAYS USING EXPERIENCE<br>
    ALWAYS USHERING (TO) EXTREMES<br>
    ALTERING UR EXPECTATIONS<br>
    ALGUNOS USAN EXCUSAS<br>
    <span class="lowercase-line">(nosotros no)</span><br>
    AUTOTELIC USER EXPERIENCE<br>
    ANTES USABA EXTASIS<br>
    AUXILIARY<br>
    AUXILIO<br>
    EY YOU EX
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <script>
    const FLICKR_API_KEY = "9a39e096d96d657fcd59345af98faabb";
    const SEARCH_TAGS    = ["AUX"];
    const TAG_MODE       = "any";
    const INTERVAL_MS    = 700;
    const TOTAL_PHOTOS   = 300;

    const canvas = document.getElementById("dither-canvas");
    const ctx    = canvas.getContext("2d");

    function resizeCanvas() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    function renderSingle(img) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    }

    let urls         = [];
    let queue        = [];
    let currentImg   = null;
    let nextImgReady = null;

    function dequeue() {
      if (queue.length === 0) queue = [...urls].sort(() => Math.random() - 0.5);
      return queue.shift();
    }

    function makeImg(src) {
      return new Promise(resolve => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload  = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = src;
      });
    }

    async function preloadNext() {
      const url = dequeue();
      const img = await makeImg(url);
      if (img) nextImgReady = img;
    }

    function next() {
      if (!nextImgReady || !currentImg) return;
      currentImg   = nextImgReady;
      nextImgReady = null;
      triggerKick();
      renderSingle(currentImg);
      preloadNext();
    }

    let started   = false;
    let toneReady = false;
    let kick, kickFilter;

    function initAudio() {
      if (toneReady) return;
      toneReady = true;
      kickFilter = new Tone.Filter({ frequency: 200, type: "lowpass", rolloff: -24 }).toDestination();
      kick = new Tone.MembraneSynth({
        envelope: { attack: 0.001, attackCurve: "exponential", decay: 0.1, release: 1.4, sustain: 0.01 },
        octaves: 30,
        oscillator: { type: "sine" },
        pitchDecay: 0.03,
      }).connect(kickFilter);
    }

    function triggerKick() {
      if (toneReady && kick) kick.triggerAttackRelease("C1", "8n");
    }

    function fetchPage(page) {
      return new Promise((resolve, reject) => {
        const cbName = "_flickrCb_" + Date.now() + "_" + page;
        const script = document.createElement("script");
        window[cbName] = (data) => {
          delete window[cbName];
          document.head.removeChild(script);
          if (data.stat !== "ok") return reject(new Error(data.message));
          resolve(data.photos.photo || []);
        };
        script.onerror = () => reject(new Error("JSONP failed"));
        const params = new URLSearchParams({
          method: "flickr.photos.search", api_key: FLICKR_API_KEY,
          tags: SEARCH_TAGS.join(","), tag_mode: TAG_MODE, sort: "interestingness-desc",
          content_type: "1", media: "photos", extras: "url_m,url_q",
          per_page: "100", page: String(page), safe_search: "1",
          format: "json", jsoncallback: cbName,
        });
        script.src = `https://api.flickr.com/services/rest/?${params}`;
        document.head.appendChild(script);
      });
    }

    function photoToUrl(p) {
      return p.url_m || p.url_q ||
        `https://live.staticflickr.com/${p.server}/${p.id}_${p.secret}_m.jpg`;
    }

    // ── Cursor tooltip — replaces cursor after activation ─────────
    const logoWrap    = document.getElementById("logo-wrap");
    const spinner     = document.getElementById("spinner");
    const spinnerFill = document.getElementById("spinner-fill");
    const tooltip     = document.getElementById("cursor-tooltip");
    const CIRCUMFERENCE = 2 * Math.PI * 10;

    let cursorReplaced = false;
    let mouse = { x: 0, y: 0 };
    let pos   = { x: 0, y: 0 };
    let vel   = { x: 0, y: 0 };
    const STIFFNESS = 0.12;
    const DAMPING   = 0.72;

    document.addEventListener("mousemove", (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    function springLoop() {
      if (cursorReplaced) {
        const ax = (mouse.x - pos.x) * STIFFNESS;
        const ay = (mouse.y - pos.y) * STIFFNESS;
        vel.x = (vel.x + ax) * DAMPING;
        vel.y = (vel.y + ay) * DAMPING;
        pos.x += vel.x;
        pos.y += vel.y;
        tooltip.style.left = pos.x + "px";
        tooltip.style.top  = pos.y + "px";
      }
      requestAnimationFrame(springLoop);
    }
    requestAnimationFrame(springLoop);

    function activateCursorReplacement() {
      cursorReplaced = true;
      document.body.classList.add("cursor-hidden");
      pos.x = mouse.x;
      pos.y = mouse.y;
      vel.x = 0; vel.y = 0;
      tooltip.style.left = pos.x + "px";
      tooltip.style.top  = pos.y + "px";
      tooltip.classList.add("always-visible");
    }

    function setRingProgress(pct) {
      spinnerFill.style.strokeDasharray  = CIRCUMFERENCE;
      spinnerFill.style.strokeDashoffset = CIRCUMFERENCE * (1 - pct);
    }

    logoWrap.addEventListener("click", async () => {
      if (started) return;
      await Tone.start();
      initAudio();
      started = true;
      logoWrap.classList.add("activated");
      spinner.classList.add("visible");
      setRingProgress(0);

      try {
        const pages   = Math.ceil(TOTAL_PHOTOS / 100);
        const results = await Promise.all(
          Array.from({ length: pages }, (_, i) => {
            return fetchPage(i + 1).then(r => {
              setRingProgress((i + 1) / pages * 0.8);
              return r;
            });
          })
        );
        const photos = results.flat().map(photoToUrl).filter(Boolean);
        if (!photos.length) { console.warn("No photos."); return; }

        urls  = photos;
        queue = [...urls].sort(() => Math.random() - 0.5);

        const firstImg = await makeImg(dequeue());
        if (!firstImg) return;
        currentImg = firstImg;
        renderSingle(currentImg);
        canvas.classList.add("visible");
        setRingProgress(1);

        setTimeout(() => {
          spinner.classList.remove("visible");
          logoWrap.classList.add("hoverable");
          activateCursorReplacement();
        }, 300);

        preloadNext();
        setTimeout(preloadNext, 100);
        setInterval(next, INTERVAL_MS);
      } catch (err) {
        console.error("Flickr fetch failed:", err);
      }
    });
  </script>

</body>
</html>
